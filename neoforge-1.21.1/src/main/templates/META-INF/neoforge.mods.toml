modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="Roostyk"
credits="Original Better Mount HUD (Fabric) by Lortseam and contributors: https://github.com/Lortseam/better-mount-hud"
# Client-only mod: it does not need to be installed on the server.
displayTest="IGNORE_ALL_VERSION"
description='''
Keeps your hunger, experience and air visible while you ride a horse or any other mount.

Unofficial NeoForge/Forge port of Better Mount HUD by Lortseam (GPL-3.0).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
